<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSCR Gap Filling</title>
<script>try{var fscrT=localStorage.getItem("fscr-theme")}catch(e){}document.documentElement.setAttribute("data-theme",fscrT==="dusk"||fscrT==="light"?fscrT:"night")</script>
<link rel="stylesheet" href="assets/site.css">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:calc(var(--navh,52px) + 28px) 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.howbtn{display:inline-flex;align-items:center;gap:10px;padding:10px 18px 10px 14px;border-radius:999px;border:1px solid var(--hl);background:var(--glass);color:var(--ink);font-size:15px;font-weight:600;text-decoration:none;box-shadow:0 4px 18px rgba(77,110,255,.18);transition:box-shadow .2s,border-color .2s,transform .2s}
.howbtn:hover{border-color:var(--focus);box-shadow:0 8px 26px rgba(77,110,255,.3);transform:translateY(-1px)}
.howbtn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.howbtn .play{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:grid;place-items:center}
.howbtn .arr{color:var(--focus);transition:transform .2s}.howbtn:hover .arr{transform:translateX(3px)}
header h1{font-size:clamp(26px,3.6vw,40px);line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.015em;background:var(--gr-main);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0;color:var(--ink2);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:20px;box-shadow:var(--shadow)}
h2{font-size:18px;margin:0 0 4px;font-weight:620}
.sub{color:var(--ink2);font-size:14px;margin:0 0 16px}
.num{font-variant-numeric:tabular-nums}

/* headline */
#headline{cursor:pointer;transition:border-color .2s,box-shadow .2s;display:block;width:100%;text-align:left;font:inherit;color:inherit}
#headline:hover{border-color:var(--hl);box-shadow:var(--shadow),0 0 0 1px var(--hl)}
#headline:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.hl{display:grid;grid-template-columns:1fr 1fr auto;gap:28px;align-items:center}
.tile .lbl{font-size:15px;color:var(--ink2);font-weight:560}
.tile.before .big{background:var(--gr-blue);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile.now .big{background:var(--gr-mint);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile .big{font-size:clamp(44px,7vw,68px);font-weight:680;line-height:1.05;letter-spacing:-.02em}
.tile .of{font-size:16px;color:var(--ink2);font-weight:450;letter-spacing:0}
.meter{height:12px;background:var(--open);border-radius:6px;overflow:hidden;margin:12px 0 8px}
.meter i{display:block;height:100%;width:0;border-radius:6px;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.tile.before .meter i{background:var(--before);box-shadow:0 0 12px var(--before)}
.tile.now .meter i{background:linear-gradient(90deg,var(--before) var(--split,70%),var(--tested) var(--split,70%))}
.grey{color:var(--ink3);font-size:14px}
.gain{margin-top:18px;font-size:clamp(18px,2.4vw,22px);font-weight:600}
.gain b{color:var(--gainink)}
.hint{margin-top:6px;color:var(--before);font-size:14px;font-weight:560}
.ring{width:132px;height:132px}
#ringArc{filter:drop-shadow(0 0 6px var(--before))}
.ring text{font-family:inherit}

/* modules */
#modules{overflow:hidden}
#modules[hidden]{display:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 18px;padding:0;list-style:none;font-size:14px;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:7px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:230px 1fr 92px;gap:14px;align-items:center;padding:5px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;border:0;background:none;font:inherit;color:inherit;text-align:left;width:calc(100% + 16px)}
.row:hover,.row.sel{background:var(--hover)}
.row:focus-visible{outline:2px solid var(--focus)}
.row .name{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{font-size:13.5px;color:var(--ink2);text-align:right}
.bar{display:flex;height:16px;gap:2px;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar span{height:100%;min-width:0}
.bar span:first-child{border-radius:4px 0 0 4px}
.bar span:last-child{border-radius:0 4px 4px 0}
.bar span:only-child{border-radius:4px}
.s-before{background:var(--before)} .s-tested{background:var(--tested)} .s-written{background:var(--written)}
.s-screen{background:var(--screen)} .s-open{background:var(--open);box-shadow:inset 0 0 0 1px var(--openline)} .s-failed{background:var(--failed)}
.axisnote{font-size:13px;color:var(--ink3);margin-top:12px}

/* detail panel */
#detail{border-color:var(--hl);animation:pop .25s ease-out}
#detail[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dhead{display:flex;justify-content:space-between;align-items:start;gap:12px}
.close{border:1px solid var(--line);background:var(--glass);border-radius:8px;padding:4px 12px;font:inherit;font-size:14px;color:var(--ink2);cursor:pointer}
.close:hover{background:var(--hover)}
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:16px 0 10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .k{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.stat .v{font-size:24px;font-weight:650}
.dwords{font-size:16px;margin:4px 0 0}

.tip{position:fixed;pointer-events:none;background:var(--tipbg);color:var(--tipink);border:1px solid var(--line);font-size:13px;line-height:1.4;padding:7px 10px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);opacity:0;transition:opacity .12s;z-index:10;max-width:240px}
.tip.on{opacity:1}
footer{margin-top:22px;font-size:14px;color:var(--ink2)}
footer p{margin:4px 0}
.err{color:var(--err)}

@media (max-width:760px){
  .wrap{padding:calc(var(--navh,52px) + 18px) 16px 36px}
  .card{padding:18px}
  .hl{grid-template-columns:1fr 1fr;gap:18px}
  .ring{grid-column:1/-1;justify-self:center;width:112px;height:112px;order:-1}
  .row{grid-template-columns:1fr auto;gap:4px 10px}
  .row .bar{grid-column:1/-1;grid-row:2}
  .stats{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:420px){
  .hl{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:1400px){ body{font-size:18px} .wrap{max-width:1180px} .row .name{font-size:16px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<nav class="topnav" aria-label="Pages">
  <a class="brand" href="index.html"><i></i>FSCR gap filling</a>
  <ul><li><a class="lnk" href="index.html" aria-current="page">Dashboard</a></li><li><a class="lnk" href="story.html">How it works</a></li><li><a class="lnk" href="technical.html">Technical details</a></li></ul>
</nav>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">FSCR gap filling: ERP and SCM</h1>
      <p id="updated">Last updated: …</p>
    </div>
    <a class="howbtn" href="story.html"><span class="play" aria-hidden="true"><svg width="10" height="11" viewBox="0 0 10 11"><path d="M1 1.2v8.6c0 .5.5.8.9.5l6.9-4.3c.4-.2.4-.8 0-1L1.9.7C1.5.4 1 .7 1 1.2z" fill="#fff"/></svg></span>See how it works<span class="arr" aria-hidden="true">→</span></a>
  </header>

  <button class="card" id="headline" type="button" aria-expanded="false" aria-controls="modules">
    <div class="hl">
      <div class="tile before">
        <div class="lbl">Skills before</div>
        <div class="big num" id="hBefore">–</div>
        <div class="meter"><i id="mBefore"></i></div>
        <div class="grey num" id="hBeforeOf"></div>
      </div>
      <div class="tile now">
        <div class="lbl">Skills available now</div>
        <div class="big num" id="hNow">–</div>
        <div class="meter"><i id="mNow"></i></div>
        <div class="grey num" id="hNowOf"></div>
      </div>
      <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Skills available out of all tasks">
        <circle cx="60" cy="60" r="50" fill="none" stroke="var(--open)" stroke-width="10"/>
        <circle id="ringArc" cx="60" cy="60" r="50" fill="none" stroke="var(--before)" stroke-width="10" stroke-linecap="round"
          transform="rotate(-90 60 60)" stroke-dasharray="0 314.16" style="transition:stroke-dasharray 1.1s cubic-bezier(.2,.7,.2,1)"/>
        <text id="ringPct" x="60" y="56" text-anchor="middle" font-size="24" font-weight="650" fill="var(--ink)">–</text>
        <text x="60" y="74" text-anchor="middle" font-size="11" fill="var(--ink2)">of all tasks</text>
        <text x="60" y="88" text-anchor="middle" font-size="11" fill="var(--ink2)">have a skill</text>
      </svg>
    </div>
    <div class="gain num" id="hGain"></div>
    <div class="hint" id="hint">Show each module ▾</div>
  </button>

  <section class="card" id="modules" hidden>
    <h2>Each module</h2>
    <p class="sub">One bar per module, longest gap list first. Bar length = all tasks of the module. Tap a bar for its numbers.</p>
    <ul class="legend" id="legend"></ul>
    <div class="rows" id="rows"></div>
    <div class="axisnote" id="leftout"></div>
  </section>

  <section class="card" id="detail" hidden aria-live="polite">
    <div class="dhead">
      <div><h2 id="dName"></h2><p class="sub" id="dPillar" style="margin:0"></p></div>
      <button class="close" id="dClose" type="button">Close</button>
    </div>
    <div class="stats" id="dStats"></div>
    <p class="dwords num" id="dWords"></p>
    <p class="grey num" id="dGrey" style="margin:2px 0 0"></p>
  </section>


  <footer>
    <p id="foot2" class="grey"></p>
  </footer>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script src="data/data.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var fmt = function(n){ return (n==null) ? "–" : Number(n).toLocaleString("en-US"); };
  var pct = function(a,b){ return b ? Math.round(1000*a/b)/10 : 0; };
  var SEG = [
    {k:"before",  label:"Skills before",  cls:"s-before"},
    {k:"tested",  label:"Tested",         cls:"s-tested"},
    {k:"written", label:"Written",        cls:"s-written"},
    {k:"failed",  label:"Failed",         cls:"s-failed"},
    {k:"screen_only", label:"Screen-only", cls:"s-screen"},
    {k:"open",    label:"Open",           cls:"s-open"}
  ];
  var tip = $("tip");
  function showTip(html, e){
    tip.innerHTML = html; tip.classList.add("on");
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.min(e.clientX + 14, window.innerWidth - w - 8);
    var y = e.clientY - h - 12; if (y < 8) y = e.clientY + 18;
    tip.style.left = Math.max(8,x) + "px"; tip.style.top = y + "px";
  }
  function hideTip(){ tip.classList.remove("on"); }

  function getJSON(url){
    return fetch(url, {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(url); return r.json(); });
  }
  function load(){
    // Opened by double-click: browsers block fetch on file://, so use data.js directly.
    if (location.protocol === "file:" && window.DASHBOARD_DATA) return Promise.resolve(window.DASHBOARD_DATA);
    return Promise.all([getJSON("data/data.json"), getJSON("data/history.json")])
      .then(function(v){ var d = v[0]; d.history = v[1]; return d; })
      .catch(function(){
        if (window.DASHBOARD_DATA) return window.DASHBOARD_DATA;
        throw new Error("no data");
      });
  }

  function gainWords(before, avail){
    var g = avail - before;
    return "+" + fmt(g) + (g === 1 ? " skill, " : " skills, ") + pct(g, before) + "% more";
  }

  function render(d){
    var s = d.summary;
    $("title").textContent = d.title;
    $("updated").textContent = "Last updated: " + d.updated;
    $("hBefore").innerHTML = fmt(s.before);
    $("hBeforeOf").textContent = "of " + fmt(s.total) + " tasks (" + pct(s.before,s.total) + "%)";
    $("hNow").innerHTML = fmt(s.available);
    $("hNowOf").textContent = "of " + fmt(s.total) + " tasks (" + pct(s.available,s.total) + "%)";
    $("hGain").innerHTML = "<b>" + gainWords(s.before, s.available).replace(", ", "</b>, ");
    var mNow = $("mNow");
    mNow.style.setProperty("--split", pct(s.before, s.available) + "%");
    var P = pct(s.available, s.total);
    $("ringPct").textContent = Math.round(P) + "%";
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      $("mBefore").style.width = pct(s.before, s.total) + "%";
      mNow.style.width = P + "%";
      $("ringArc").setAttribute("stroke-dasharray", (3.1416*100*P/100).toFixed(1) + " 314.16");
    });});

    // legend
    $("legend").innerHTML = SEG.filter(function(g){ return g.k!=="failed" || s.failed>0; }).map(function(g){
      return '<li><span class="sw ' + g.cls + '"></span>' + g.label + "</li>";
    }).join("");

    // module rows
    var mods = d.modules.filter(function(m){ return m.in_charts; })
      .sort(function(a,b){ return (b.missing - a.missing) || a.name.localeCompare(b.name); });
    var max = Math.max.apply(null, mods.map(function(m){ return m.total || m.missing; }));
    var rows = $("rows"); rows.innerHTML = "";
    mods.forEach(function(m){
      var row = document.createElement("button");
      row.type = "button"; row.className = "row";
      row.setAttribute("aria-label", m.name + ": " + (m.total==null ? "total not found" : fmt(m.available) + " of " + fmt(m.total) + " skills available"));
      var segs = SEG.filter(function(g){ return (m[g.k]||0) > 0; }).map(function(g){
        return '<span class="' + g.cls + '" data-k="' + g.k + '" style="flex:' + m[g.k] + ' 1 0"></span>';
      }).join("");
      var val = m.total==null ? "total not found" : fmt(m.available) + " / " + fmt(m.total);
      row.innerHTML = '<span class="name">' + m.name + '</span><span class="bar" data-w="' +
        (100*(m.total||m.missing)/max).toFixed(2) + '">' + segs + '</span><span class="val num">' + val + "</span>";
      row.addEventListener("click", function(){ openDetail(m, row); });
      row.addEventListener("pointermove", function(e){
        if (e.pointerType !== "mouse") return;
        var k = e.target.getAttribute && e.target.getAttribute("data-k");
        var lines = SEG.filter(function(g){ return g.k!=="failed" || m.failed>0; }).map(function(g){
          var on = g.k===k ? ' style="font-weight:700"' : "";
          return "<div" + on + '><span class="sw ' + g.cls + '" style="width:9px;height:9px;margin-right:6px"></span>' + g.label + ": " + fmt(m[g.k]) + "</div>";
        }).join("");
        showTip("<b>" + m.name + "</b><br>" + lines, e);
      });
      row.addEventListener("pointerleave", hideTip);
      rows.appendChild(row);
    });
    var lo = (d.left_out||[]);
    $("leftout").textContent = lo.length ? lo.join(", ") + " is left out: it has no missing tasks." : "";
    $("foot2").textContent = "Counts from the gap index and the FSCR catalog totals. " + fmt(s.missing) +
      " missing tasks in " + mods.length + " modules" + (lo.length ? " (" + lo.join(", ") + " left out, no gaps)." : ".");

  }

  var growDone = false;
  function grow(){
    if (growDone) return; growDone = true;
    var bars = document.querySelectorAll("#rows .bar");
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      bars.forEach(function(b,i){ b.style.transitionDelay = (i*25) + "ms"; b.style.width = b.getAttribute("data-w") + "%"; });
    });});
  }

  var selRow = null;
  function openDetail(m, row){
    if (selRow) selRow.classList.remove("sel");
    selRow = row; row.classList.add("sel");
    $("dName").textContent = m.name;
    $("dPillar").textContent = m.pillar ? m.pillar + " module" : "";
    var items = [["Total","total",null],["Before","before","s-before"],["Tested","tested","s-tested"],["Written","written","s-written"],
                 ["Screen-only","screen_only","s-screen"],["Open","open","s-open"],["Failed","failed","s-failed"]];
    $("dStats").innerHTML = items.map(function(it){
      var v = m[it[1]]; var sw = it[2] ? '<span class="sw ' + it[2] + '"></span>' : "";
      return '<div class="stat"><div class="k">' + sw + it[0] + '</div><div class="v num">' + (v==null ? "not found" : fmt(v)) + "</div></div>";
    }).join("");
    if (m.total == null){
      $("dWords").textContent = "Total not found in the FSCR catalog.";
      $("dGrey").textContent = fmt(m.tested) + " tested, " + fmt(m.written) + " written";
    } else {
      $("dWords").innerHTML = "Skills before <b>" + fmt(m.before) + "</b> of " + fmt(m.total) +
        " → available now <b>" + fmt(m.available) + "</b> of " + fmt(m.total) + ". " +
        (m.available > m.before ? gainWords(m.before, m.available).replace(/% more$/, "% more") + "." :
         (m.before === 0 ? "No skills yet." : "No change yet."));
      if (m.before === 0 && m.available > 0) $("dWords").innerHTML = $("dWords").innerHTML.replace(/, [\d.]+% more/, " (none before)");
      $("dGrey").textContent = fmt(m.tested) + " tested, " + fmt(m.written) + " written";
    }
    var p = $("detail"); p.hidden = false;
    p.style.animation = "none"; p.offsetHeight; p.style.animation = "";
    p.scrollIntoView({behavior:"smooth", block:"nearest"});
  }
  $("dClose").addEventListener("click", function(){ $("detail").hidden = true; if (selRow) selRow.classList.remove("sel"); });

  $("headline").addEventListener("click", function(){
    var sec = $("modules"), open = sec.hidden;
    sec.hidden = !open;
    this.setAttribute("aria-expanded", String(open));
    $("hint").textContent = open ? "Hide modules ▴" : "Show each module ▾";
    if (open){ grow(); sec.scrollIntoView({behavior:"smooth", block:"nearest"}); }
    else { $("detail").hidden = true; }
  });

  load().then(render).catch(function(){
    document.querySelector(".wrap").insertAdjacentHTML("beforeend",
      '<p class="err">Could not load the data. Run "python dashboard\\update.py" and keep the data folder next to this page.</p>');
  });
})();
</script>
</body>
</html>
